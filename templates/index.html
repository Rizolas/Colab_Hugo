<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Predicción de Ventas</title>
</head>
<body>
  <h1>Predicción de Ventas</h1>
  <form action="/predecir" method="POST">
    <label for="publicidad">Gasto en publicidad:</label>
    <input type="number" step="any" name="publicidad" id="publicidad" required>
    <button type="submit">Predecir</button>
  </form>
  {% if resultado is defined %}
    <p>Predicción: {{ resultado }}</p>
  {% endif %}
</body>
</html>
